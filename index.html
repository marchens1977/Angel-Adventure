<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Megabarsch - Point & Click Adventure</title>
    <!-- Installierbare App (Web-App / PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2b1b0c">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-title" content="Megabarsch">
    <style>
        body { background: #111; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        #game-container { width: 100%; max-width: 800px; box-sizing: border-box; border: 4px solid #333; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        canvas { display: block; width: 100%; height: auto; cursor: pointer; }
        #ui-bar { background: #222; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #444; }
        .verbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .verb-btn { background: #333; color: #ff0; border: 1px solid #666; padding: 8px 12px; cursor: pointer; font-family: monospace; font-weight: bold; }
        .verb-btn:hover { background: #444; }
        .verb-btn.active { border-color: #ff0; background: #555; }
        #status-text { color: #0ff; font-weight: bold; font-size: 14px; min-height: 2.4em; }
        #inventory { color: #fff; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .item-btn { background: #2b1b0c; color: #fff; border: 1px solid #8a6a3a; padding: 6px 10px; cursor: pointer; font-family: monospace; }
        .item-btn.selected { border-color: #ff0; color: #ff0; }
        /* Startbildschirm */
        #screen { position: relative; }
        #start-screen { position: absolute; inset: 0; background: url('assets/start.jpg') center / cover no-repeat;
                        display: flex; flex-direction: column; align-items: center; justify-content: space-between;
                        padding: 6% 0 8%; box-sizing: border-box; }
        #start-title { color: #ffcc00; font-size: clamp(26px, 8vw, 56px); font-weight: bold; letter-spacing: 3px;
                       text-shadow: 3px 3px 0 #2b1b0c, -1px -1px 0 #2b1b0c; margin: 0; }
        #start-btn { background: #5c3a21; color: #ffcc00; border: 3px solid #2b1b0c; box-shadow: 0 0 0 2px #ffcc00;
                     font-family: monospace; font-weight: bold; font-size: clamp(16px, 4.5vw, 24px);
                     padding: 10px 26px; cursor: pointer; }
        #start-btn:hover, #start-btn:focus { background: #7a4e2d; }
        body.title #ui-bar { display: none; }
    </style>
</head>
<body class="title">

    <div id="game-container">
        <div id="screen">
            <canvas id="gameCanvas" width="800" height="450"></canvas>
            <!-- Startbildschirm: liegt über dem Spiel, bis man auf "Spiel starten" tippt -->
            <div id="start-screen">
                <h1 id="start-title">MEGABARSCH</h1>
                <button id="start-btn" onclick="beginGame()">Spiel starten</button>
            </div>
        </div>
        <div id="ui-bar">
            <div class="verbs">
                <span>Aktion: <span id="current-verb">Gehe zu</span> |</span>
                <button class="verb-btn active" data-verb="Gehe" onclick="setVerb('Gehe')">Gehe zu</button>
                <button class="verb-btn" data-verb="Schau an" onclick="setVerb('Schau an')">Schau an</button>
                <button class="verb-btn" data-verb="Nimm" onclick="setVerb('Nimm')">Nimm</button>
                <button class="verb-btn" data-verb="Benutze" onclick="setVerb('Benutze')">Benutze</button>
                <button class="verb-btn" data-verb="Rede mit" onclick="setVerb('Rede mit')">Rede mit</button>
                <button class="verb-btn" data-verb="Gib" onclick="setVerb('Gib')">Gib</button>
            </div>
            <div id="status-text">Klicke im Laden, um zu interagieren.</div>
            <div id="inventory">Inventar: Leer</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- Einstellungen ----------
    const FLOOR_Y = 420;            // Füße der Figur auf dem Boden (y-Position)
    const PLAYER_SCALE = 1.75;      // Wie stark die Figur vergrößert wird (passend zu Raum und Besitzer)
    const PLAYER_W = 150 * PLAYER_SCALE, PLAYER_H = 130 * PLAYER_SCALE;
    const WALK_SPEED = 3.5;         // Pixel pro Bild beim Laufen
    const OWNER = { x: 560, feetY: 300, w: 150, h: 160 };
    const COUNTER_CLIP = { x: 400, y: 255, w: 300, h: 145 }; // Bereich der Theke, der den Besitzer verdeckt
    const COUNTER_STAND_X = 470;    // Wo die Figur beim Besitzer stehen bleibt
    const SHELF_STAND_X = 230;      // Wo die Figur beim Regal stehen bleibt
    const KEY_POS = { x: 516, y: 100 }; // Wo der Schlüssel an der Lampe hängt

    // ---------- Spielzustand ----------
    let currentVerb = 'Gehe';
    let playerX = 400;
    let targetX = null;
    let pendingAction = null;       // Was passieren soll, wenn die Figur angekommen ist
    let facing = 1;                 // 1 = rechts, -1 = links
    let frame = 0;                  // 0..5 = Laufbild, 0 ist auch Standbild
    let frameTick = 0;
    let hasQuest = false;           // Auftrag vom Besitzer bekommen
    let hasRod = false;             // Rute aus dem Regal genommen
    let knowsLine = false;          // weiß, dass die Schnur im Lager ist
    let hasNet = false;             // Kescher genommen
    let keyTaken = false;           // Schlüssel von der Lampe geholt
    let storeOpen = false;          // Lager aufgeschlossen
    let rodReady = false;           // Schnur an der Rute = fertige Angel
    let inventory = [];             // Liste der Gegenstände (ihre Kürzel, siehe ITEMS)
    let selectedItem = null;        // gewählter Gegenstand bei "Benutze ... mit" / "Gib ... an"

    // ---------- Gegenstände ----------
    const ITEMS = {
        rute:      { name: 'Rute (ohne Schnur)', look: 'Eine robuste Baitcast-Rute. Nur leider ohne Schnur.' },
        kescher:   { name: 'Kescher',            look: 'Ein alter Kescher mit langem Stiel. Damit kommt man überall hin.' },
        schluessel:{ name: 'Schlüssel',          look: 'Ein kleiner Messingschlüssel. Auf dem Anhänger steht „LAGER“.' },
        schnur:    { name: 'Angelschnur',        look: 'Eine Rolle extra starke Angelschnur. „Hält bis 5 Kilo“, steht drauf.' },
        dose:      { name: 'Würmerdose (leer)',  look: 'Eine leere Würmerdose. Fehlen nur noch die Würmer.' },
        angel:     { name: 'Angel',              look: 'Rute mit Schnur – eine richtige Angel! Jetzt fehlen nur Köder.' }
    };

    // ---------- Bilder laden ----------
    const images = {};
    const imageNames = ['shop', 'owner', 'player_1', 'player_2', 'player_3', 'player_4', 'player_5', 'player_6'];
    let loadedCount = 0;
    imageNames.forEach(name => {
        const img = new Image();
        img.onload = img.onerror = () => {
            loadedCount++;
            if (loadedCount === imageNames.length) startGame();
        };
        img.src = 'assets/' + name + (name === 'shop' ? '.jpg' : '.png');
        images[name] = img;
    });

    function startGame() {
        updateInventory();
        gameLoop();
    }

    // Startbildschirm ausblenden und das eigentliche Spiel zeigen
    function beginGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.body.classList.remove('title');
    }

    // ---------- Installierbare App: Hintergrund-Helfer anmelden ----------
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js');
    }

    // ---------- Bedienung ----------
    function setVerb(verb) {
        currentVerb = verb;
        selectedItem = null;
        updateInventory();
        document.getElementById('current-verb').innerText = verb;
        document.querySelectorAll('.verb-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.verb === verb);
        });
    }

    function setStatus(text) {
        document.getElementById('status-text').innerText = text;
    }

    // Inventar als Knöpfe anzeigen (antippen: anschauen, benutzen, geben)
    function updateInventory() {
        const box = document.getElementById('inventory');
        box.innerHTML = '';
        const label = document.createElement('span');
        label.innerText = 'Inventar:' + (inventory.length ? '' : ' Leer');
        box.appendChild(label);
        inventory.forEach(id => {
            const b = document.createElement('button');
            b.className = 'item-btn' + (id === selectedItem ? ' selected' : '');
            b.dataset.item = id;
            b.innerText = ITEMS[id].name;
            b.onclick = () => clickItem(id);
            box.appendChild(b);
        });
    }

    function walkTo(x, action, message) {
        targetX = Math.max(60, Math.min(740, x));
        pendingAction = action;
        if (message) setStatus(message);
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        // Klick-Position umrechnen, falls das Bild am Handy verkleinert ist
        const x = (e.clientX - rect.left) * canvas.width / rect.width;
        const y = (e.clientY - rect.top) * canvas.height / rect.height;

        const spot = HOTSPOTS.find(h => x >= h.x1 && x <= h.x2 && y >= h.y1 && y <= h.y2);
        if (!spot || currentVerb === 'Gehe') {
            walkTo(x, null, null);
            return;
        }
        const verb = currentVerb, item = selectedItem;
        // "Schau an" geht ohne Hinlaufen
        if (verb === 'Schau an') { spot.act(verb, null); return; }
        walkTo(spot.stand, () => { spot.act(verb, item); resetSelection(); }, 'Du gehst zu: ' + spot.name + '.');
    });

    // ---------- Gegenstände im Inventar antippen ----------
    function clickItem(id) {
        if (currentVerb === 'Benutze' || currentVerb === 'Gib') {
            if (!selectedItem) {
                selectedItem = id;
                document.getElementById('current-verb').innerText =
                    currentVerb === 'Benutze' ? 'Benutze ' + ITEMS[id].name + ' mit …' : 'Gib ' + ITEMS[id].name + ' an …';
                updateInventory();
                return;
            }
            if (currentVerb === 'Benutze' && selectedItem !== id) {
                combine(selectedItem, id);
                resetSelection();
                return;
            }
            resetSelection();
            return;
        }
        if (currentVerb === 'Rede mit') { setStatus('Selbstgespräche mit einem Gegenstand? Lieber nicht.'); return; }
        if (currentVerb === 'Nimm') { setStatus('Das hast du schon eingepackt.'); return; }
        setStatus(ITEMS[id].look);
    }

    // Zwei Gegenstände kombinieren
    function combine(a, b) {
        const paar = [a, b].sort().join('+');
        if (paar === 'rute+schnur') {
            removeItem('rute'); removeItem('schnur'); addItem('angel');
            rodReady = true;
            setStatus('Du fädelst die Schnur ein und knotest sie fest. Fertig ist die Angel!');
        } else {
            setStatus('Das passt nicht zusammen.');
        }
    }

    function addItem(id) { if (!inventory.includes(id)) inventory.push(id); updateInventory(); }
    function removeItem(id) { inventory = inventory.filter(i => i !== id); updateInventory(); }
    function hasItem(id) { return inventory.includes(id); }

    function resetSelection() {
        selectedItem = null;
        document.getElementById('current-verb').innerText = currentVerb;
        updateInventory();
    }

    // ---------- Klickbereiche im Laden (in Canvas-Pixeln, 800 x 450) ----------
    // Reihenfolge wichtig: kleine Bereiche zuerst. "stand" = wo die Figur stehen bleibt.
    const HOTSPOTS = [
        { name: 'Lampe', x1: 492, x2: 542, y1: 15, y2: 120, stand: 480, act: lampAction },
        { name: 'Kescher', x1: 435, x2: 492, y1: 112, y2: 205, stand: 450, act: netAction },
        { name: 'Kasse', x1: 448, x2: 514, y1: 185, y2: 248, stand: 470, act: registerAction },
        { name: 'Glas', x1: 612, x2: 662, y1: 220, y2: 275, stand: 600, act: jarAction },
        { name: 'Lagertür', x1: 612, x2: 722, y1: 100, y2: 335, stand: 715, act: doorAction },
        { name: 'Pinnwand', x1: 728, x2: 800, y1: 110, y2: 225, stand: 720, act: boardAction },
        { name: 'Besitzer', x1: 490, x2: 612, y1: 110, y2: 370, stand: COUNTER_STAND_X, act: ownerAction },
        { name: 'Regal', x1: 90, x2: 380, y1: 60, y2: 380, stand: SHELF_STAND_X, act: shelfAction }
    ];

    // ---------- Was bei den einzelnen Dingen passiert ----------
    function ownerAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus('Herr Kiemer, der Ladenbesitzer. Brummig, aber mit dem Herz am rechten Fleck.');
        } else if (verb === 'Rede mit') {
            if (!hasQuest) {
                setStatus("Kiemer: 'Hast du's gehört? Baron von Blinker will den Silbersee kaufen! Nur wenn jemand " +
                          "bis Sonntag den Megabarsch lebend fängt, ist der See gerettet. Nimm dir eine Rute aus dem Regal!'");
                hasQuest = true;
            } else if (!hasRod) {
                setStatus("Kiemer: 'Nimm dir drüben eine Rute aus dem Regal!'");
            } else if (!storeOpen) {
                setStatus("Kiemer: 'Schnur? Die gute liegt im Lager. Aber den Schlüssel hab ich irgendwo " +
                          "aufgehängt … ich werd alt.'");
                knowsLine = true;
            } else if (!rodReady) {
                setStatus("Kiemer: 'Na, Schnur gefunden? Dann knote sie an die Rute!'");
            } else {
                setStatus("Kiemer: 'Prima Angel! Jetzt fehlen nur noch Köder. Würmer findest du draußen am Ufer.' " +
                          "(Fortsetzung folgt …)");
            }
        } else if (verb === 'Gib' && item) {
            setStatus("Kiemer: 'Behalt das mal lieber. Das brauchst du noch.'");
        } else if (verb === 'Nimm') {
            setStatus('Den Besitzer kannst du nicht einpacken.');
        } else {
            setStatus("Kiemer: 'Kann ich helfen?'");
        }
    }

    function shelfAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus('Ruten, Rollen, Blinker, Posen – ein Paradies für Angler.');
        } else if (verb === 'Nimm') {
            if (hasQuest && !hasRod) {
                hasRod = true;
                addItem('rute');
                setStatus('Du nimmst eine robuste Rute aus dem Regal. Moment … da ist ja gar keine Schnur dran!');
            } else if (hasRod) {
                setStatus('Du hast bereits eine Rute eingepackt.');
            } else {
                setStatus('Das solltest du jetzt noch nicht mitnehmen.');
            }
        } else if (verb === 'Rede mit') {
            setStatus('Die Ruten antworten nicht.');
        } else {
            setStatus('Du stehst vor dem Regal.');
        }
    }

    function lampAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus(keyTaken ? 'Eine alte Petroleumlampe. Gemütliches Licht.'
                               : 'Eine alte Petroleumlampe. Daran baumelt ein kleiner Schlüssel!');
        } else if (verb === 'Nimm') {
            setStatus(keyTaken ? 'Die Lampe bleibt hängen.'
                               : 'Der Schlüssel hängt viel zu hoch. Du bräuchtest etwas mit einem langen Stiel.');
        } else if (verb === 'Benutze' && item === 'kescher') {
            if (keyTaken) { setStatus('Da hängt nichts mehr.'); return; }
            keyTaken = true;
            addItem('schluessel');
            setStatus("Du angelst mit dem Kescher nach dem Schlüssel … geschafft! Kiemer: 'Ach, DA war der!'");
        } else if (verb === 'Benutze' && item) {
            setStatus('Damit kommst du nicht hoch genug.');
        } else if (verb === 'Rede mit') {
            setStatus('Die Lampe schweigt. Sie ist eher der helle Typ.');
        } else {
            setStatus('Du stehst unter der Lampe.');
        }
    }

    function netAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus('Ein paar alte Kescher mit langen Stielen.');
        } else if (verb === 'Nimm') {
            if (hasNet) { setStatus('Ein Kescher reicht.'); return; }
            if (!hasQuest) { setStatus("Kiemer: 'Hände weg, das ist Ware!'"); return; }
            hasNet = true;
            addItem('kescher');
            setStatus("Kiemer: 'Den alten Kescher? Nimm ruhig, der ist eh nichts mehr wert.'");
        } else {
            setStatus('Die Kescher hängen ordentlich im Regal.');
        }
    }

    function registerAction(verb, item) {
        if (verb === 'Schau an') setStatus('Eine uralte Registrierkasse. Sie hat schon bessere Tage gesehen.');
        else if (verb === 'Benutze') setStatus('Ding! Die Kasse ist leer. Das Geschäft läuft wohl nicht so gut.');
        else if (verb === 'Nimm') setStatus("Kiemer: 'Lass das. Wirklich.'");
        else setStatus('Die Kasse sagt nichts. Höchstens „Ding“.');
    }

    function jarAction(verb, item) {
        if (verb === 'Schau an') setStatus('Ein Glas voller bunter Gummiwürmer. Ganz unten glitzert etwas.');
        else if (verb === 'Nimm') setStatus("Kiemer: 'Finger weg von meinen Gummiwürmern!'");
        else setStatus('Lecker sehen die nicht aus.');
    }

    function doorAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus(storeOpen ? 'Das Lager. Hier hast du die Schnur gefunden.'
                                : 'Hinter dem Perlenvorhang ist die Tür zum Lager.');
        } else if (verb === 'Benutze' && item === 'schluessel') {
            storeOpen = true;
            removeItem('schluessel');
            addItem('schnur');
            addItem('dose');
            setStatus('Du schließt das Lager auf und findest eine Rolle Angelschnur und eine leere Würmerdose. ' +
                      'Den Schlüssel gibst du Kiemer zurück.');
        } else if (verb === 'Benutze' || verb === 'Nimm') {
            setStatus(storeOpen ? 'Im Lager ist nichts Nützliches mehr.' : 'Die Lagertür ist abgeschlossen.');
        } else {
            setStatus('Die Tür bleibt stumm.');
        }
    }

    function boardAction(verb, item) {
        if (verb === 'Schau an') {
            setStatus("Ein Aushang: 'Der Silbersee wird am Sonntag an Baron von Blinker verkauft. " +
                      "Gez. der Bürgermeister.' Daneben alte Fotos von Riesenfischen.");
        } else if (verb === 'Nimm') {
            setStatus('Der Aushang bleibt hängen. Das soll ruhig jeder lesen.');
        } else {
            setStatus('Eine Pinnwand voller Zettel.');
        }
    }

    // ---------- Figur bewegen ----------
    function update() {
        if (targetX !== null) {
            const dx = targetX - playerX;
            if (Math.abs(dx) <= WALK_SPEED) {
                playerX = targetX;
                targetX = null;
                frame = 0;
                if (pendingAction) {
                    const action = pendingAction;
                    pendingAction = null;
                    action();
                }
            } else {
                const dir = Math.sign(dx);
                playerX += dir * WALK_SPEED;
                facing = dir;
                frameTick++;
                if (frameTick % 6 === 0) frame = (frame + 1) % 6;
            }
        } else {
            frame = 0;
        }
    }

    // ---------- Zeichnen ----------
    function drawSprite(img, centerX, feetY, w, h, flip) {
        ctx.save();
        ctx.translate(centerX, feetY);
        if (flip) ctx.scale(-1, 1);
        ctx.drawImage(img, -w / 2, -h, w, h);
        ctx.restore();
    }

    // Kleiner goldener Schlüssel, an einer Schnur hängend
    function drawKey(x, y) {
        ctx.save();
        ctx.translate(x, y); ctx.scale(1.7, 1.7); ctx.translate(-x, -y); // etwas größer, damit man ihn am Handy sieht
        ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 6); ctx.stroke();
        ctx.fillStyle = '#e8c040'; ctx.strokeStyle = '#6a4a10';
        ctx.beginPath(); ctx.arc(x, y + 9, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillRect(x - 1, y + 12, 2, 9);
        ctx.fillRect(x + 1, y + 17, 3, 2);
        ctx.fillRect(x + 1, y + 20, 2, 1);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(images.shop, 0, 0, canvas.width, canvas.height);

        // Ladenschild oben
        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(545, 6, 210, 30);
        ctx.strokeStyle = '#2b1b0c';
        ctx.lineWidth = 3;
        ctx.strokeRect(545, 6, 210, 30);
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FISHING SHOP', 650, 28);
        ctx.textAlign = 'left';

        // Schlüssel an der Lampe (bis er geholt wird)
        if (!keyTaken) drawKey(KEY_POS.x, KEY_POS.y);

        // Ladenbesitzer
        drawSprite(images.owner, OWNER.x, OWNER.feetY, OWNER.w, OWNER.h, false);

        // Theke wieder vorn drüber zeichnen, damit der Besitzer hinter dem Tresen steht
        ctx.drawImage(images.shop, COUNTER_CLIP.x, COUNTER_CLIP.y, COUNTER_CLIP.w, COUNTER_CLIP.h,
                                   COUNTER_CLIP.x, COUNTER_CLIP.y, COUNTER_CLIP.w, COUNTER_CLIP.h);

        // Hauptfigur (Standbild oder Laufbild)
        const playerImg = images['player_' + (frame + 1)];
        drawSprite(playerImg, playerX, FLOOR_Y, PLAYER_W, PLAYER_H, facing < 0);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
</script>

</body>
</html>
